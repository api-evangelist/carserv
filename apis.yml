name: CarServ
description: >-
  CarServ was auto repair shop management software — marketed as "the operating
  system for auto repair" — used by single-site shops and multi-location repair
  groups to run repair orders, Digital Vehicle Inspections, technician and service
  advisor workflows, customer communication and payments. The company was backed by
  Techstars. It is no longer operating: carserv.com returned HTTP 410 Gone through
  late 2024 and now resolves to a registrar parking page delegated to Afternic name
  servers. CarServ shipped a read-only JSON:API v2 "Public API" covering repair
  orders, customers, vehicles, appointments, inspections, operations and their part,
  labor and sublet line items, authenticated by exchanging an API key and secret for
  a JWT bearer token. No OpenAPI definition, developer portal or documentation
  survives; this profile reconstructs the historical API contract from the company's
  own open-source Ruby client library, which remains public on GitHub.
